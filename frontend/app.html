<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCEAN-X / ARIEL — Advanced Ocean Intelligence</title>
    <!-- High priority pre-connections for satellite tiles and fonts -->
    <link rel="preconnect" href="https://services.arcgisonline.com" crossorigin />
    <link rel="dns-prefetch" href="https://services.arcgisonline.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #F7F0E6;
        color: #20242A;
        overflow: hidden;
      }
      @keyframes ariel-pulse-ring {
        0% { transform: scale(0.88); opacity: 0.7; }
        50% { transform: scale(1.12); opacity: 0.25; }
        100% { transform: scale(0.88); opacity: 0.7; }
      }
      @keyframes ariel-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes ariel-spin-reverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      .ariel-loader-container {
        position: fixed;
        inset: 0;
        background: #F7F0E6;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        font-family: 'Inter', -apple-system, sans-serif;
        color: #20242A;
      }
      .ariel-sonar-box {
        position: relative;
        width: 90px;
        height: 90px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ariel-sonar-ring-1 {
        position: absolute;
        inset: 0;
        border: 1.5px solid rgba(216, 120, 98, 0.35);
        border-radius: 50%;
        animation: ariel-pulse-ring 2.4s ease-in-out infinite;
      }
      .ariel-sonar-ring-2 {
        position: absolute;
        inset: 8px;
        border: 1.5px solid transparent;
        border-top-color: #D87862;
        border-right-color: #D6AE63;
        border-radius: 50%;
        animation: ariel-spin 1.4s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
      }
      .ariel-sonar-ring-3 {
        position: absolute;
        inset: 18px;
        border: 1.5px solid transparent;
        border-bottom-color: #7FB8AD;
        border-left-color: rgba(214, 174, 99, 0.5);
        border-radius: 50%;
        animation: ariel-spin-reverse 2s linear infinite;
      }
      .ariel-sonar-core {
        width: 20px;
        height: 20px;
        background: #D87862;
        border-radius: 50%;
      }
      .ariel-loader-title {
        font-family: 'Cormorant Garamond', 'DM Serif Display', Georgia, serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #17324A;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ariel-loader-subtitle {
        font-size: 10px;
        color: #5C5248;
        letter-spacing: 0.14em;
        font-family: 'IBM Plex Mono', monospace;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant First-Paint Loading Screen -->
      <div class="ariel-loader-container">
        <div class="ariel-sonar-box">
          <div class="ariel-sonar-ring-1"></div>
          <div class="ariel-sonar-ring-2"></div>
          <div class="ariel-sonar-ring-3"></div>
          <div class="ariel-sonar-core"></div>
        </div>
        <div class="ariel-loader-title">
          <span>INCOIS</span>
          <span style="color: #D87862; font-weight: 400;">/</span>
          <span style="color: #D87862;">ARIEL</span>
        </div>
        <div class="ariel-loader-subtitle">INITIALIZING DIGITAL OCEAN TWIN · SCIENTIFIC SUNSET</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
